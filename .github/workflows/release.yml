name: Release browser matrix
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps "$RELEASE_BROWSER"
        env:
          RELEASE_BROWSER: ${{ matrix.browser }}
      - run: npm run test:release -- --project="$RELEASE_BROWSER"
        env:
          RELEASE_BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: release-${{ matrix.browser }}-failure
          path: test-results
          retention-days: 14
